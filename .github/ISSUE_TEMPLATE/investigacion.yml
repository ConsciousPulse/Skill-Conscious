name: Nuevo protocolo de investigación
description: Proponer una hipótesis y un experimento reproducible.
title: "[INVESTIGACIÓN] "
labels:
  - investigación
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hipótesis
      description: ¿Qué relación o capacidad querés poner a prueba?
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Protocolo
      description: Describí variables, controles, intervención y criterio de éxito.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia esperada
      description: ¿Qué mediría el experimento y qué resultado sería nulo?
    validations:
      required: true
