name: Informe de error
description: Reportar un problema reproducible del software.
title: "[ERROR] "
labels:
  - error
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: ¿Qué ocurrió?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproducción
      description: Pasos mínimos para reproducirlo.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Python, sistema operativo, commit y otros datos relevantes.
    validations:
      required: false
