name: common-future-erasure-v6
on:
  push:
    paths:
      - "research/common_future_erasure_v6.py"
      - ".github/workflows/common-future-erasure-v6.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  erasure:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/common_future_erasure_v6.py | tee /tmp/common_future_erasure_v6.txt
      - uses: actions/upload-artifact@v4
        with:
          name: common-future-erasure-v6
          path: results/common_future_erasure_v6/
          if-no-files-found: error
