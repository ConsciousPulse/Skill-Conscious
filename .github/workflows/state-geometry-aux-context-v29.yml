name: state-geometry-aux-context-v29
on:
  push:
    paths:
      - "research/state_geometry_aux_context_v29.py"
      - ".github/workflows/state-geometry-aux-context-v29.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  aux_context:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_aux_context_v29.py | tee /tmp/state_geometry_aux_context_v29.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-aux-context-v29
          path: results/state_geometry_aux_context_v29/
          if-no-files-found: error
