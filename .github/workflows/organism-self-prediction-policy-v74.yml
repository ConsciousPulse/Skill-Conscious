name: organism-self-prediction-policy-v74

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/organism_self_prediction_policy_v74.py"
      - "tests/test_organism_self_prediction_policy_v74.py"
      - "docs/V74_SELF_PREDICTION_POLICY.md"
      - "src/ontto/self_observer.py"
      - "src/ontto/self_policy.py"
      - ".github/workflows/organism-self-prediction-policy-v74.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_self_prediction_policy_v74.py
      - run: python experiments/organism_self_prediction_policy_v74.py --episodes 64 --train-episodes 64 --observer-samples 512
      - uses: actions/upload-artifact@v4
        with:
          name: organism-self-prediction-policy-v74
          path: results/organism_self_prediction_policy_v74/
          if-no-files-found: error
