name: state-geometry-cross-history-reference-v40
on:
  push:
    paths:
      - "research/state_geometry_cross_history_reference_v40.py"
      - ".github/workflows/state-geometry-cross-history-reference-v40.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  cross_history_reference:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_cross_history_reference_v40.py | tee /tmp/state_geometry_cross_history_reference_v40.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-cross-history-reference-v40
          path: results/state_geometry_cross_history_reference_v40/
          if-no-files-found: error
