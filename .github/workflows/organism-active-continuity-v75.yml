name: organism-active-continuity-v75

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/organism_active_continuity_v75.py"
      - "tests/test_organism_active_continuity_v75.py"
      - "docs/V75_ACTIVE_CONTINUITY.md"
      - "src/ontto/self_observer.py"
      - "src/ontto/self_policy.py"
      - "src/ontto/trajectory_selector.py"
      - ".github/workflows/organism-active-continuity-v75.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_active_continuity_v75.py
      - run: python experiments/organism_active_continuity_v75.py --episodes 64 --train-episodes 64 --observer-samples 512 --recovery-steps 12
      - uses: actions/upload-artifact@v4
        with:
          name: organism-active-continuity-v75
          path: results/organism_active_continuity_v75/
          if-no-files-found: error
