name: organism-self-model-selection-v57

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/trajectory_selector.py"
      - "src/ontto/self_observer.py"
      - "experiments/organism_self_model_selection_v57.py"
      - "tests/test_organism_self_model_selection_v57.py"
      - ".github/workflows/organism-self-model-selection-v57.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_self_model_selection_v57.py
      - run: python experiments/organism_self_model_selection_v57.py --replicates 24 --warmup 32
      - uses: actions/upload-artifact@v4
        with:
          name: organism-self-model-selection-v57
          path: results/organism_self_model_selection_v57/
          if-no-files-found: error