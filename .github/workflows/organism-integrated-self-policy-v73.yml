name: organism-integrated-self-policy-v73

on:
  workflow_dispatch:
  push:
    paths:
      - "src/ontto/self_policy.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "experiments/organism_integrated_self_policy_v73.py"
      - "tests/test_organism_integrated_self_policy_v73.py"
      - ".github/workflows/organism-integrated-self-policy-v73.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_integrated_self_policy_v73.py
      - run: python experiments/organism_integrated_self_policy_v73.py --replicates 24 --observer-samples 256 --train-episodes 64
      - uses: actions/upload-artifact@v4
        with:
          name: organism-integrated-self-policy-v73
          path: results/organism_integrated_self_policy_v73/
          if-no-files-found: error
