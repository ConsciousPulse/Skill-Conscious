name: minimal-state-v16
on:
  push:
    paths:
      - "research/minimal_state_v16.py"
      - ".github/workflows/minimal-state-v16.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  bottleneck:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/minimal_state_v16.py | tee /tmp/minimal_state_v16.txt
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-state-v16
          path: results/minimal_state_v16/
          if-no-files-found: error