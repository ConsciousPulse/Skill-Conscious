name: state-geometry-metric-robustness-v35
on:
  push:
    paths:
      - "research/state_geometry_metric_robustness_v35.py"
      - ".github/workflows/state-geometry-metric-robustness-v35.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  metric_robustness:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_metric_robustness_v35.py | tee /tmp/state_geometry_metric_robustness_v35.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-metric-robustness-v35
          path: results/state_geometry_metric_robustness_v35/
          if-no-files-found: error
