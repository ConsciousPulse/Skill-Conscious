name: organism-attractor-awareness-v54

on:
  pull_request:
    paths:
      - "experiments/organism_attractor_awareness_v54.py"
      - "tests/test_organism_attractor_awareness_v54.py"
      - "src/ontto/organism.py"
      - ".github/workflows/organism-attractor-awareness-v54.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_attractor_awareness_v54.py
      - run: python experiments/organism_attractor_awareness_v54.py --mode fake --cycles 80
      - uses: actions/upload-artifact@v4
        with:
          name: organism-attractor-awareness-v54
          path: results/organism_attractor_awareness_v54/
          if-no-files-found: error
