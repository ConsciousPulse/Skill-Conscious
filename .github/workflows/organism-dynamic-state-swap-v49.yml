name: organism-dynamic-state-swap-v49

on:
  push:
    paths:
      - "experiments/organism_dynamic_state_swap_v49.py"
      - "tests/test_organism_dynamic_state_swap_v49.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - ".github/workflows/organism-dynamic-state-swap-v49.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_dynamic_state_swap_v49.py
      - run: python experiments/organism_dynamic_state_swap_v49.py --mode fake
      - uses: actions/upload-artifact@v4
        with:
          name: organism-dynamic-state-swap-v49
          path: results/organism_dynamic_state_swap_v49/
          if-no-files-found: error
