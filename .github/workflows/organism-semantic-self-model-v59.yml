name: organism-semantic-self-model-v59

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/trajectory_selector.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/memory_policy.py"
      - "src/ontto/continuity.py"
      - "experiments/organism_semantic_self_model_v59.py"
      - "tests/test_organism_semantic_self_model_v59.py"
      - ".github/workflows/organism-semantic-self-model-v59.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_semantic_self_model_v59.py
      - run: python experiments/organism_semantic_self_model_v59.py --replicates 24 --warmup 32
      - uses: actions/upload-artifact@v4
        with:
          name: organism-semantic-self-model-v59
          path: results/organism_semantic_self_model_v59/
          if-no-files-found: error
