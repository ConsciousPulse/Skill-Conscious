name: quantized-state-transplant-v17
on:
  push:
    paths:
      - "research/quantized_state_transplant_v17.py"
      - ".github/workflows/quantized-state-transplant-v17.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  transplant:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/quantized_state_transplant_v17.py | tee /tmp/quantized_state_transplant_v17.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quantized-state-transplant-v17
          path: results/quantized_state_transplant_v17/
          if-no-files-found: error