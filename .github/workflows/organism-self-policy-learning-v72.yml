name: organism-self-policy-learning-v72

on:
  workflow_dispatch:
  push:
    paths:
      - "src/ontto/self_policy.py"
      - "experiments/organism_self_policy_learning_v72.py"
      - "tests/test_organism_self_policy_learning_v72.py"
      - "docs/V72_SELF_POLICY_LEARNING.md"
      - ".github/workflows/organism-self-policy-learning-v72.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_self_policy_learning_v72.py
      - run: python experiments/organism_self_policy_learning_v72.py --episodes 64 --train-episodes 64 --observer-samples 512
      - uses: actions/upload-artifact@v4
        with:
          name: organism-self-policy-learning-v72
          path: results/organism_self_policy_learning_v72/
          if-no-files-found: error
