name: state-geometry-context-ensemble-v32
on:
  push:
    paths:
      - "research/state_geometry_context_ensemble_v32.py"
      - ".github/workflows/state-geometry-context-ensemble-v32.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  ensemble:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_context_ensemble_v32.py | tee /tmp/state_geometry_context_ensemble_v32.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-context-ensemble-v32
          path: results/state_geometry_context_ensemble_v32/
          if-no-files-found: error
