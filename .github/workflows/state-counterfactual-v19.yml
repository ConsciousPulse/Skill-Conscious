name: state-counterfactual-v19
on:
  push:
    paths:
      - "research/state_counterfactual_v19.py"
      - ".github/workflows/state-counterfactual-v19.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  counterfactual:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_counterfactual_v19.py | tee /tmp/state_counterfactual_v19.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-counterfactual-v19
          path: results/state_counterfactual_v19/
          if-no-files-found: error