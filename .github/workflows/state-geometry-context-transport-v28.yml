name: state-geometry-context-transport-v28
on:
  push:
    paths:
      - "research/state_geometry_context_transport_v28.py"
      - ".github/workflows/state-geometry-context-transport-v28.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  transport:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_context_transport_v28.py | tee /tmp/state_geometry_context_transport_v28.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-context-transport-v28
          path: results/state_geometry_context_transport_v28/
          if-no-files-found: error
