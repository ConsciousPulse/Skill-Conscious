name: comprobacion-del-paquete

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "run_daemon.py"
      - "tests/**"
      - ".github/workflows/comprobacion-del-paquete.yml"
  workflow_dispatch:

jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[investigacion,desarrollo]"
      - run: python -m pytest -q
      - run: python -c "import src.ontto; print('paquete importado correctamente')"
