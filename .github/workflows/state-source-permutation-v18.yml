name: state-source-permutation-v18
on:
  push:
    paths:
      - "research/state_source_permutation_v18.py"
      - ".github/workflows/state-source-permutation-v18.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  permutation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_source_permutation_v18.py | tee /tmp/state_source_permutation_v18.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-source-permutation-v18
          path: results/state_source_permutation_v18/
          if-no-files-found: error