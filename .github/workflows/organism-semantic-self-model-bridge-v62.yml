name: organism-semantic-self-model-bridge-v62

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/memory_policy.py"
      - "src/ontto/continuity.py"
      - "experiments/organism_semantic_self_model_bridge_v62.py"
      - "tests/test_organism_semantic_self_model_bridge_v62.py"
      - ".github/workflows/organism-semantic-self-model-bridge-v62.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_semantic_self_model_bridge_v62.py
      - run: python experiments/organism_semantic_self_model_bridge_v62.py --replicates 24
      - uses: actions/upload-artifact@v4
        with:
          name: organism-semantic-self-model-bridge-v62
          path: results/organism_semantic_self_model_bridge_v62/
          if-no-files-found: error