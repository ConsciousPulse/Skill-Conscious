name: organism-semantic-bridge-v58

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/memory_policy.py"
      - "src/ontto/continuity.py"
      - "experiments/organism_semantic_bridge_v58.py"
      - "tests/test_organism_semantic_bridge_v58.py"
      - ".github/workflows/organism-semantic-bridge-v58.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_semantic_bridge_v58.py
      - run: python experiments/organism_semantic_bridge_v58.py
      - uses: actions/upload-artifact@v4
        with:
          name: organism-semantic-bridge-v58
          path: results/organism-semantic-bridge-v58/
          if-no-files-found: error