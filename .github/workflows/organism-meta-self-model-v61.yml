name: organism-meta-self-model-v61

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/meta_observer.py"
      - "src/ontto/trajectory_selector.py"
      - "experiments/organism_meta_self_model_v61.py"
      - "tests/test_organism_meta_self_model_v61.py"
      - ".github/workflows/organism-meta-self-model-v61.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_meta_self_model_v61.py
      - run: python experiments/organism_meta_self_model_v61.py --replicates 24 --warmup 32 --cycles 32
      - uses: actions/upload-artifact@v4
        with:
          name: organism-meta-self-model-v61
          path: results/organism_meta_self_model_v61/
          if-no-files-found: error