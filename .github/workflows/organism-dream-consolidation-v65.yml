name: organism-dream-consolidation-v65

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/memory_policy.py"
      - "src/ontto/continuity.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/trajectory_selector.py"
      - "experiments/organism_dream_consolidation_v65.py"
      - "tests/test_organism_dream_consolidation_v65.py"
      - ".github/workflows/organism-dream-consolidation-v65.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_dream_consolidation_v65.py
      - run: python experiments/organism_dream_consolidation_v65.py --replicates 24
      - uses: actions/upload-artifact@v4
        with:
          name: organism-dream-consolidation-v65
          path: results/organism_dream_consolidation_v65/
          if-no-files-found: error
