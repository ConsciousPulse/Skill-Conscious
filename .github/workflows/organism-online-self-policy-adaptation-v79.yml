name: organism-online-self-policy-adaptation-v79

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/organism_online_self_policy_adaptation_v79.py"
      - "tests/test_organism_online_self_policy_adaptation_v79.py"
      - "docs/V79_ONLINE_SELF_POLICY_ADAPTATION.md"
      - "experiments/organism_repeated_active_continuity_v78.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/self_policy.py"
      - ".github/workflows/organism-online-self-policy-adaptation-v79.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_online_self_policy_adaptation_v79.py
      - run: python experiments/organism_online_self_policy_adaptation_v79.py --episodes-per-condition 64 --train-episodes 64 --observer-samples 512
      - uses: actions/upload-artifact@v4
        with:
          name: organism-online-self-policy-adaptation-v79
          path: results/organism_online_self_policy_adaptation_v79/
          if-no-files-found: error
