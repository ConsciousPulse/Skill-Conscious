name: state-geometry-probe-generalization-v46

on:
  push:
    paths:
      - "research/state_geometry_probe_generalization_v46.py"
      - ".github/workflows/state-geometry-probe-generalization-v46.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  generalization:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_probe_generalization_v46.py | tee /tmp/state_geometry_probe_generalization_v46.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-probe-generalization-v46
          path: results/state_geometry_probe_generalization_v46/
          if-no-files-found: error
