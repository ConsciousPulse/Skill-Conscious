name: parametric-resonance-v2
on:
  push:
    paths:
      - "research/parametric_resonance_v2.py"
      - "research/parametric_v2_core.py"
      - ".github/workflows/parametric-resonance-v2.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  v2:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run second zoom, boundary, ablations and validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          python research/parametric_resonance_v2.py | tee results/parametric_resonance_v2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parametric-resonance-v2-${{ github.sha }}
          path: results/parametric_resonance_v2/
          if-no-files-found: error
