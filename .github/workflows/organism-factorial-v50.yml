name: organism-factorial-v50

on:
  pull_request:
    paths:
      - "experiments/organism_factorial_v50.py"
      - "tests/test_organism_factorial_v50.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - ".github/workflows/organism-factorial-v50.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_factorial_v50.py
      - run: python experiments/organism_factorial_v50.py --mode fake --replicates 4
      - uses: actions/upload-artifact@v4
        with:
          name: organism-factorial-v50
          path: results/organism_factorial_v50/
          if-no-files-found: error
