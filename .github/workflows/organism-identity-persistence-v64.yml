name: organism-identity-persistence-v64

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/memory_policy.py"
      - "src/ontto/continuity.py"
      - "experiments/organism_identity_persistence_v64.py"
      - "tests/test_organism_identity_persistence_v64.py"
      - ".github/workflows/organism-identity-persistence-v64.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_identity_persistence_v64.py
      - run: python experiments/organism_identity_persistence_v64.py --replicates 24
      - uses: actions/upload-artifact@v4
        with:
          name: organism-identity-persistence-v64
          path: results/organism_identity_persistence_v64/
          if-no-files-found: error
