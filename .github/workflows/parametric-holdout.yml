name: parametric-holdout

on:
  push:
    paths:
      - "research/parametric_holdout_v1.py"
      - ".github/workflows/parametric-holdout.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: parametric-holdout
  cancel-in-progress: true

jobs:
  holdout:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run blind holdout validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          python research/parametric_holdout_v1.py | tee results/parametric_holdout_v1.txt

      - name: Upload holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: parametric-holdout-${{ github.sha }}
          path: results/parametric_holdout_v1/
          if-no-files-found: error
