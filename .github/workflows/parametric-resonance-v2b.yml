name: resonance-v2b
on:
  push:
    paths:
      - ".github/workflows/parametric-resonance-v2b.yml"
      - "research/parametric_resonance_v2.py"
      - "research/parametric_v2_core.py"
      - "src/ontto/parametric_v2_core.py"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python research/parametric_resonance_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-v2b
          path: results/parametric_resonance_v2/
