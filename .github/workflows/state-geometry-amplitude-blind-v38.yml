name: state-geometry-amplitude-blind-v38
on:
  push:
    paths:
      - "research/state_geometry_amplitude_blind_v38.py"
      - ".github/workflows/state-geometry-amplitude-blind-v38.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  amplitude_blind:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_amplitude_blind_v38.py | tee /tmp/state_geometry_amplitude_blind_v38.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-amplitude-blind-v38
          path: results/state_geometry_amplitude_blind_v38/
          if-no-files-found: error
