name: organism-self-observation-v51

on:
  pull_request:
    paths:
      - "src/ontto/self_observer.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - "experiments/organism_self_observation_v51.py"
      - "tests/test_self_observer.py"
      - "tests/test_organism_self_observation_v51.py"
      - ".github/workflows/organism-self-observation-v51.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_self_observer.py tests/test_organism_self_observation_v51.py
      - run: python experiments/organism_self_observation_v51.py --cycles 120
      - uses: actions/upload-artifact@v4
        with:
          name: organism-self-observation-v51
          path: results/organism_self_observation_v51/
          if-no-files-found: error
