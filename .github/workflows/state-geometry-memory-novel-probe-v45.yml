name: state-geometry-memory-novel-probe-v45

on:
  push:
    paths:
      - "research/state_geometry_memory_novel_probe_v45.py"
      - ".github/workflows/state-geometry-memory-novel-probe-v45.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  novel-probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_memory_novel_probe_v45.py | tee /tmp/state_geometry_memory_novel_probe_v45.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-memory-novel-probe-v45
          path: results/state_geometry_memory_novel_probe_v45/
          if-no-files-found: error
