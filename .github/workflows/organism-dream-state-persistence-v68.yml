name: organism-dream-state-persistence-v68

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/organism_dream_state_persistence_v68.py"
      - "tests/test_organism_dream_state_persistence_v68.py"
      - "experiments/organism_dream_state_trace_v67.py"
      - "src/ontto/**"
      - ".github/workflows/organism-dream-state-persistence-v68.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_dream_state_persistence_v68.py tests/test_organism_dream_state_trace_v67.py
      - run: python experiments/organism_dream_state_persistence_v68.py --replicates 24 --horizons 0,1,2,4,8,16,32
      - uses: actions/upload-artifact@v4
        with:
          name: organism-dream-state-persistence-v68
          path: results/organism_dream_state_persistence_v68/
          if-no-files-found: error
