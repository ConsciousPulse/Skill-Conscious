name: state-polar-replication-v25
on:
  push:
    paths:
      - "research/state_polar_replication_v25.py"
      - ".github/workflows/state-polar-replication-v25.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  replication:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_polar_replication_v25.py | tee /tmp/state_polar_replication_v25.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-polar-replication-v25
          path: results/state_polar_replication_v25/
          if-no-files-found: error

# reproducible trigger: V25 confirmation workflow
