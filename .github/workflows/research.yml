name: research-lab

on:
  push:
    paths:
      - "src/**"
      - "experiments/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "src/**"
      - "experiments/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research.yml"
  workflow_dispatch:

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Run baseline dynamics
        run: python experiments/baseline_dynamics_v1.py

      - name: Run validation suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          python experiments/v0_validate.py | tee results/v0_validate.txt
          python experiments/continuity_validation_v1.py | tee results/continuity_validation_v1.txt

      - name: Write run manifest
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
          }

          Path("results/run_manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-${{ github.sha }}
          path: results/
          if-no-files-found: error
