name: organism-self-selection-v53

on:
  pull_request:
    paths:
      - "src/ontto/trajectory_selector.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/organism.py"
      - "tests/test_trajectory_selector.py"
      - "tests/test_organism_self_selection_v53.py"
      - ".github/workflows/organism-self-selection-v53.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_trajectory_selector.py tests/test_organism_self_selection_v53.py
