name: memory-lifetime-v5
on:
  push:
    paths:
      - "research/memory_lifetime_v5.py"
      - ".github/workflows/memory-lifetime-v5.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  lifetime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Measure direct memory lifetime
        run: |
          python research/memory_lifetime_v5.py | tee /tmp/memory_lifetime_v5.txt
      - uses: actions/upload-artifact@v4
        with:
          name: memory-lifetime-v5
          path: results/memory_lifetime_v5/
          if-no-files-found: error
