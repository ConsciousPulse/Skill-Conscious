name: self-prediction-v13
on:
  push:
    paths:
      - "research/self_prediction_v13.py"
      - ".github/workflows/self-prediction-v13.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  prediction:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/self_prediction_v13.py | tee /tmp/self_prediction_v13.txt
      - uses: actions/upload-artifact@v4
        with:
          name: self-prediction-v13
          path: results/self_prediction_v13/
          if-no-files-found: error
