name: tcf-consciousness-instantiation-c0

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/tcf_consciousness_instantiation_c0.py"
      - "tests/test_tcf_consciousness_instantiation_c0.py"
      - "docs/C0_TCF_CONSCIOUSNESS_INSTANTIATION.md"
      - "experiments/organism_repeated_active_continuity_v78.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/self_policy.py"
      - ".github/workflows/tcf-consciousness-instantiation-c0.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_tcf_consciousness_instantiation_c0.py
      - run: python experiments/tcf_consciousness_instantiation_c0.py --episodes 64 --train-episodes 64 --observer-samples 512 --recovery-steps 12
      - uses: actions/upload-artifact@v4
        with:
          name: tcf-consciousness-instantiation-c0
          path: results/tcf_consciousness_instantiation_c0/
          if-no-files-found: error
