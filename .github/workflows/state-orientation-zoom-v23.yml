name: state-orientation-zoom-v23
on:
  push:
    paths:
      - "research/state_orientation_zoom_v23.py"
      - ".github/workflows/state-orientation-zoom-v23.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  zoom:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_orientation_zoom_v23.py | tee /tmp/state_orientation_zoom_v23.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-orientation-zoom-v23
          path: results/state_orientation_zoom_v23/
          if-no-files-found: error