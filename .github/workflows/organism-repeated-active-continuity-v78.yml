name: organism-repeated-active-continuity-v78

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/organism_repeated_active_continuity_v78.py"
      - "tests/test_organism_repeated_active_continuity_v78.py"
      - "docs/V78_REPEATED_ACTIVE_CONTINUITY.md"
      - "src/ontto/self_observer.py"
      - "src/ontto/self_policy.py"
      - "src/ontto/trajectory_selector.py"
      - ".github/workflows/organism-repeated-active-continuity-v78.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_repeated_active_continuity_v78.py
      - run: python experiments/organism_repeated_active_continuity_v78.py --episodes-per-condition 64 --train-episodes 64 --observer-samples 512 --recovery-steps 12
      - uses: actions/upload-artifact@v4
        with:
          name: organism-repeated-active-continuity-v78
          path: results/organism_repeated_active_continuity_v78/
          if-no-files-found: error
