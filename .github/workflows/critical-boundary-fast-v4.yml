name: critical-boundary-fast-v4
on:
  push:
    paths:
      - "research/critical_boundary_fast_v4.py"
      - ".github/workflows/critical-boundary-fast-v4.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  boundary:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python research/critical_boundary_fast_v4.py | tee /tmp/critical_boundary_fast_v4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: critical-boundary-fast-v4
          path: results/critical_boundary_fast_v4/
          if-no-files-found: error
