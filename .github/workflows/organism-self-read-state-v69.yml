name: organism-self-read-state-v69

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/organism_self_read_state_v69.py"
      - "tests/test_organism_self_read_state_v69.py"
      - "experiments/organism_dream_state_trace_v67.py"
      - "src/ontto/**"
      - ".github/workflows/organism-self-read-state-v69.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_self_read_state_v69.py
      - run: python experiments/organism_self_read_state_v69.py --replicates 24 --self-model-samples 512
      - uses: actions/upload-artifact@v4
        with:
          name: organism-self-read-state-v69
          path: results/organism_self_read_state_v69/
          if-no-files-found: error
