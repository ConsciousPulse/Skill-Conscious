name: organism-semantic-bridge-v58-live

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI-compatible model"
        required: false
        default: ""
        type: string

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ONTTO_API_KEY: ${{ secrets.ONTTO_API_KEY }}
      ONTTO_API_BASE_URL: ${{ secrets.ONTTO_API_BASE_URL }}
      ONTTO_MODEL: ${{ secrets.ONTTO_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate secrets
        shell: bash
        run: |
          test -n "$ONTTO_API_KEY" || { echo "Missing ONTTO_API_KEY"; exit 1; }
          test -n "$ONTTO_MODEL" || { echo "Missing ONTTO_MODEL"; exit 1; }
      - name: Run live semantic bridge
        run: |
          python experiments/organism_semantic_bridge_v58.py \
            --mode live \
            --out results/organism-semantic-bridge-v58-live
      - uses: actions/upload-artifact@v4
        with:
          name: organism-semantic-bridge-v58-live-${{ github.sha }}
          path: results/organism-semantic-bridge-v58-live/
          if-no-files-found: error