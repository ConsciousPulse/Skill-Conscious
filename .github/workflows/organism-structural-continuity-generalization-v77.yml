name: organism-structural-continuity-generalization-v77

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/organism_structural_continuity_generalization_v77.py"
      - "tests/test_organism_structural_continuity_generalization_v77.py"
      - "docs/V77_STRUCTURAL_CONTINUITY_GENERALIZATION.md"
      - "src/ontto/self_observer.py"
      - "src/ontto/self_policy.py"
      - "src/ontto/trajectory_selector.py"
      - ".github/workflows/organism-structural-continuity-generalization-v77.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_structural_continuity_generalization_v77.py
      - run: python experiments/organism_structural_continuity_generalization_v77.py --episodes-per-condition 64 --train-episodes 64 --observer-samples 512 --recovery-steps 12
      - uses: actions/upload-artifact@v4
        with:
          name: organism-structural-continuity-generalization-v77
          path: results/organism_structural_continuity_generalization_v77/
          if-no-files-found: error
