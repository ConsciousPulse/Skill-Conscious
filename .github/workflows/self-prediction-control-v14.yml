name: self-prediction-control-v14
on:
  push:
    paths:
      - "research/self_prediction_control_v14.py"
      - ".github/workflows/self-prediction-control-v14.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  control:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/self_prediction_control_v14.py | tee /tmp/self_prediction_control_v14.txt
      - uses: actions/upload-artifact@v4
        with:
          name: self-prediction-control-v14
          path: results/self_prediction_control_v14/
          if-no-files-found: error
