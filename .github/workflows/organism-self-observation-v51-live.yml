name: organism-self-observation-v51-live

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Controlled organism transitions"
        required: false
        default: "120"
        type: string

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ONTTO_API_KEY: ${{ secrets.ONTTO_API_KEY }}
      ONTTO_API_BASE_URL: ${{ secrets.ONTTO_API_BASE_URL }}
      ONTTO_MODEL: ${{ secrets.ONTTO_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate secrets
        shell: bash
        run: |
          test -n "$ONTTO_API_KEY" || { echo "Missing ONTTO_API_KEY"; exit 1; }
          test -n "$ONTTO_MODEL" || { echo "Missing ONTTO_MODEL"; exit 1; }
      - name: Run self-observation protocol
        run: |
          python experiments/organism_self_observation_v51.py \
            --cycles "${{ inputs.cycles }}" \
            --out results/organism_self_observation_v51
      - uses: actions/upload-artifact@v4
        with:
          name: organism-self-observation-v51-live-${{ github.sha }}
          path: results/organism_self_observation_v51/
          if-no-files-found: error
