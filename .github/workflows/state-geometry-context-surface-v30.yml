name: state-geometry-context-surface-v30
on:
  push:
    paths:
      - "research/state_geometry_context_surface_v30.py"
      - ".github/workflows/state-geometry-context-surface-v30.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  context_surface:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_context_surface_v30.py | tee /tmp/state_geometry_context_surface_v30.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-context-surface-v30
          path: results/state_geometry_context_surface_v30/
          if-no-files-found: error
