name: organism-identity-recovery-v55

on:
  pull_request:
    paths:
      - "experiments/organism_identity_recovery_v55.py"
      - "tests/test_organism_identity_recovery_v55.py"
      - "src/ontto/organism.py"
      - "src/ontto/storage.py"
      - ".github/workflows/organism-identity-recovery-v55.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_identity_recovery_v55.py
      - run: python experiments/organism_identity_recovery_v55.py --replicates 12 --warmup 24 --recovery-cycles 40
      - uses: actions/upload-artifact@v4
        with:
          name: organism-identity-recovery-v55
          path: results/organism_identity_recovery_v55/
          if-no-files-found: error
