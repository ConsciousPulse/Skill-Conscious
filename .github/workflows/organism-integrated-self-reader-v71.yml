name: organism-integrated-self-reader-v71

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/organism_integrated_self_reader_v71.py"
      - "tests/test_organism_integrated_self_reader_v71.py"
      - "src/ontto/organism.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/storage.py"
      - ".github/workflows/organism-integrated-self-reader-v71.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_integrated_self_reader_v71.py
      - run: python experiments/organism_integrated_self_reader_v71.py --replicates 24 --reader-samples 256
      - uses: actions/upload-artifact@v4
        with:
          name: organism-integrated-self-reader-v71
          path: results/organism_integrated_self_reader_v71/
          if-no-files-found: error
