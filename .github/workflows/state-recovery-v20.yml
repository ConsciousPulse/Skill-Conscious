name: state-recovery-v20
on:
  push:
    paths:
      - "research/state_recovery_v20.py"
      - ".github/workflows/state-recovery-v20.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  recovery:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_recovery_v20.py | tee /tmp/state_recovery_v20.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-recovery-v20
          path: results/state_recovery_v20/
          if-no-files-found: error