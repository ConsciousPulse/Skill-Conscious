name: context-transplant-holdout-v12
on:
  push:
    paths:
      - "research/context_transplant_holdout_v12.py"
      - ".github/workflows/context-transplant-holdout-v12.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/context_transplant_holdout_v12.py | tee /tmp/context_transplant_holdout_v12.txt
      - uses: actions/upload-artifact@v4
        with:
          name: context-transplant-holdout-v12
          path: results/context_transplant_holdout_v12/
          if-no-files-found: error
