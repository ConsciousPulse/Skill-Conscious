name: state-geometry-reference-free-margin-v39
on:
  push:
    paths:
      - "research/state_geometry_reference_free_margin_v39.py"
      - ".github/workflows/state-geometry-reference-free-margin-v39.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  reference_free_margin:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_reference_free_margin_v39.py | tee /tmp/state_geometry_reference_free_margin_v39.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-reference-free-margin-v39
          path: results/state_geometry_reference_free_margin_v39/
          if-no-files-found: error
