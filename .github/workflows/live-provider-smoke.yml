name: live-provider-smoke

on:
  workflow_dispatch:

concurrency:
  group: live-provider-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      ONTTO_API_KEY: ${{ secrets.ONTTO_API_KEY }}
      ONTTO_API_BASE_URL: ${{ secrets.ONTTO_API_BASE_URL }}
      ONTTO_MODEL: ${{ secrets.ONTTO_MODEL }}
      ONTTO_AGENT_ID: live-smoke-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$ONTTO_API_KEY" || { echo "Missing ONTTO_API_KEY"; exit 1; }
          test -n "$ONTTO_MODEL" || { echo "Missing ONTTO_MODEL"; exit 1; }
          if [ -z "$ONTTO_API_BASE_URL" ]; then
            echo "ONTTO_API_BASE_URL not set; defaulting to https://api.openai.com/v1"
          fi

      - name: Run live provider smoke
        run: |
          mkdir -p results
          python experiments/live_provider_smoke.py | tee results/live_provider_smoke.txt

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-smoke-${{ github.sha }}
          path: results/
          if-no-files-found: error
