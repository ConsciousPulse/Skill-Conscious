name: organism-closed-loop-v60

on:
  pull_request:
    paths:
      - "src/ontto/organism.py"
      - "src/ontto/bridge.py"
      - "src/ontto/dynamics.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/trajectory_selector.py"
      - "src/ontto/memory_policy.py"
      - "src/ontto/continuity.py"
      - "experiments/organism_closed_loop_v60.py"
      - "tests/test_organism_closed_loop_v60.py"
      - ".github/workflows/organism-closed-loop-v60.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_closed_loop_v60.py
      - run: python experiments/organism_closed_loop_v60.py --replicates 24 --warmup 16 --cycles 24
      - uses: actions/upload-artifact@v4
        with:
          name: organism-closed-loop-v60
          path: results/organism_closed_loop_v60/
          if-no-files-found: error
