name: state-geometry-memory-causal-transport-v44

on:
  push:
    paths:
      - "research/state_geometry_memory_causal_transport_v44.py"
      - ".github/workflows/state-geometry-memory-causal-transport-v44.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  causal-transport:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_memory_causal_transport_v44.py | tee /tmp/state_geometry_memory_causal_transport_v44.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-memory-causal-transport-v44
          path: results/state_geometry_memory_causal_transport_v44/
          if-no-files-found: error
