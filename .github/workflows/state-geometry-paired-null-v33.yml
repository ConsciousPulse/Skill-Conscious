name: state-geometry-paired-null-v33
on:
  push:
    paths:
      - "research/state_geometry_paired_null_v33.py"
      - ".github/workflows/state-geometry-paired-null-v33.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  paired_null:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_paired_null_v33.py | tee /tmp/state_geometry_paired_null_v33.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-paired-null-v33
          path: results/state_geometry_paired_null_v33/
          if-no-files-found: error
