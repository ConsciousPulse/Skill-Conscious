name: organism-dream-state-trace-v67

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/organism_dream_state_trace_v67.py"
      - "tests/test_organism_dream_state_trace_v67.py"
      - "src/ontto/**"
      - ".github/workflows/organism-dream-state-trace-v67.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_dream_state_trace_v67.py
      - run: python experiments/organism_dream_state_trace_v67.py --replicates 24 --trace-steps 12
      - uses: actions/upload-artifact@v4
        with:
          name: organism-dream-state-trace-v67
          path: results/organism_dream_state_trace_v67/
          if-no-files-found: error
