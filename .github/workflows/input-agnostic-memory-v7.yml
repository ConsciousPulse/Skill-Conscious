name: input-agnostic-memory-v7
on:
  push:
    paths:
      - "research/input_agnostic_memory_v7.py"
      - ".github/workflows/input-agnostic-memory-v7.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  memory:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/input_agnostic_memory_v7.py | tee /tmp/input_agnostic_memory_v7.txt
      - uses: actions/upload-artifact@v4
        with:
          name: input-agnostic-memory-v7
          path: results/input_agnostic_memory_v7/
          if-no-files-found: error
