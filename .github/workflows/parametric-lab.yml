name: parametric-lab

on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/parametric-lab.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: parametric-lab
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run coarse sweep, zoom and validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          python research/parametric_resonance_v1.py | tee results/parametric_resonance_v1.txt

      - name: Upload parameter-sweep evidence
        uses: actions/upload-artifact@v4
        with:
          name: parametric-resonance-${{ github.sha }}
          path: results/parametric_resonance_v1/
          if-no-files-found: error
