name: state-geometry-cross-pair-reference-v41
on:
  push:
    paths:
      - "research/state_geometry_cross_pair_reference_v41.py"
      - ".github/workflows/state-geometry-cross-pair-reference-v41.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  cross_pair_reference:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_cross_pair_reference_v41.py | tee /tmp/state_geometry_cross_pair_reference_v41.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-cross-pair-reference-v41
          path: results/state_geometry_cross_pair_reference_v41/
          if-no-files-found: error
