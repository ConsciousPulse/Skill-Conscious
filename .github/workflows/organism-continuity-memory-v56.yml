name: organism-continuity-memory-v56

on:
  pull_request:
    paths:
      - "src/ontto/continuity.py"
      - "src/ontto/memory_policy.py"
      - "tests/test_memory_policy.py"
      - ".github/workflows/organism-continuity-memory-v56.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_memory_policy.py tests/test_continuity.py