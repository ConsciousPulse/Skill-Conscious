name: organism-persistent-self-reader-v70

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/organism_persistent_self_reader_v70.py"
      - "tests/test_organism_persistent_self_reader_v70.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/storage.py"
      - "src/ontto/organism.py"
      - "experiments/organism_dream_state_trace_v67.py"
      - "experiments/organism_self_read_state_v69.py"
      - ".github/workflows/organism-persistent-self-reader-v70.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_persistent_self_reader_v70.py
      - run: python experiments/organism_persistent_self_reader_v70.py --replicates 24 --reader-samples 256
      - uses: actions/upload-artifact@v4
        with:
          name: organism-persistent-self-reader-v70
          path: results/organism_persistent_self_reader_v70/
          if-no-files-found: error
