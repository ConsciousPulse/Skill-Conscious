name: organism-reversible-regime-adaptation-v80

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/organism_reversible_regime_adaptation_v80.py"
      - "tests/test_organism_reversible_regime_adaptation_v80.py"
      - "docs/V80_REVERSIBLE_REGIME_ADAPTATION.md"
      - "experiments/organism_repeated_active_continuity_v78.py"
      - "src/ontto/self_observer.py"
      - "src/ontto/self_policy.py"
      - ".github/workflows/organism-reversible-regime-adaptation-v80.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q tests/test_organism_reversible_regime_adaptation_v80.py
      - run: python experiments/organism_reversible_regime_adaptation_v80.py --episodes-per-condition 64 --train-episodes 64 --observer-samples 512 --recovery-steps 12
      - uses: actions/upload-artifact@v4
        with:
          name: organism-reversible-regime-adaptation-v80
          path: results/organism_reversible_regime_adaptation_v80/
          if-no-files-found: error
