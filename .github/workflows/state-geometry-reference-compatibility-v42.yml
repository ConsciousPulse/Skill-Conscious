name: state-geometry-reference-compatibility-v42
on:
  push:
    paths:
      - "research/state_geometry_reference_compatibility_v42.py"
      - ".github/workflows/state-geometry-reference-compatibility-v42.yml"
      - "src/ontto/dynamics.py"
      - "requirements.txt"
  workflow_dispatch:
jobs:
  compatibility:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python research/state_geometry_reference_compatibility_v42.py | tee /tmp/state_geometry_reference_compatibility_v42.txt
      - uses: actions/upload-artifact@v4
        with:
          name: state-geometry-reference-compatibility-v42
          path: results/state_geometry_reference_compatibility_v42/
          if-no-files-found: error
